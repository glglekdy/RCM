name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Secret 확인
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:RELEASE_TOKEN)) {
            Write-Output "::error::RELEASE_TOKEN Secret이 없어요"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm 11은 설치 스크립트를 막으므로 Electron 실행 파일을 직접 내려받는다
      - run: node node_modules/electron/install.js

      - name: 태그와 앱 버전 일치 확인
        run: node scripts/check-tag.mjs "$env:GITHUB_REF_NAME"

      # npm run release가 태그 메시지에 적은 업데이트 내역을 Release 본문으로 쓴다.
      # checkout은 태그 push일 때 태그를 커밋만 가리키는 일반 태그로 만들어 메시지가 빠지므로, 태그를 다시 받아온다
      - name: 태그에서 업데이트 내역 읽기
        env:
          TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::$tag 태그를 다시 받지 못했어요" }
          node scripts/tag-notes.mjs "$tag" "$env:RUNNER_TEMP/release-notes.md"

      - run: npm test

      - run: npm run typecheck

      # electron-builder는 파일마다 동시에 릴리스를 찾다가 초안을 두 개 만들 수 있으므로,
      # 초안을 먼저 하나만 만들어 두고 electron-builder가 그 초안에 올리게 한다 (재실행이면 있는 초안을 쓴다)
      - name: RCM 저장소에 초안 릴리스 준비
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ids = @(gh api repos/glglekdy/RCM/releases --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($ids.Count -gt 1) {
            Write-Output "::error::RCM 저장소에 $env:TAG 릴리스가 $($ids.Count)개 있어요. 하나만 남기고 지운 뒤 다시 실행하세요"
            exit 1
          }
          if ($ids.Count -eq 0) {
            gh release create "$env:TAG" --repo glglekdy/RCM --draft --title "$env:TAG" --notes ' '
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # releaseInfo.releaseName은 ${version} 매크로를 풀지 않으므로 태그 이름을 직접 넘긴다
      - name: 빌드하고 RCM 저장소에 초안 릴리스 올리기
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
        run: npm -w @rcm/editor run dist:publish -- "-c.releaseInfo.releaseName=$env:GITHUB_REF_NAME"

      - name: 초안에 업데이트 파일이 모두 있는지 확인
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ids = @(gh api repos/glglekdy/RCM/releases --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($ids.Count -ne 1) {
            Write-Output "::error::RCM 저장소의 $env:TAG 릴리스가 하나가 아니에요 ($($ids.Count)개)"
            exit 1
          }
          $assets = @(gh api "repos/glglekdy/RCM/releases/$($ids[0])" --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $version = $env:TAG.Substring(1)
          foreach ($name in @('latest.yml', "RCM-Setup-$version.exe", "RCM-Setup-$version.exe.blockmap")) {
            if ($assets -notcontains $name) {
              Write-Output "::error::초안 릴리스에 $name 파일이 없어요"
              exit 1
            }
          }
          "RELEASE_ID=$($ids[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 업데이트 내역을 넣고 정식 릴리스로 공개
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api -X PATCH "repos/glglekdy/RCM/releases/$env:RELEASE_ID" -F draft=false -F "body=@$env:RUNNER_TEMP/release-notes.md" --silent
          if ($LASTEXITCODE -ne 0) { exit 1 }
