name: release

on:
  push:
    tags: ['v*.*.*']

# contents: write = 이 저장소(RCM-Dev)에 모든 버전을 Release로 보관한다
permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # AI 가이드에 보이는 문서 수정 시각을 git 기록에서 읽는다 (얕은 checkout이면 릴리스 커밋 시각이 된다)
          fetch-depth: 0

      - name: Secret 확인
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:RELEASE_TOKEN)) {
            Write-Output "::error::RELEASE_TOKEN Secret이 없어요"
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm 11은 설치 스크립트를 막으므로 Electron 실행 파일을 직접 내려받는다
      - run: node node_modules/electron/install.js

      - name: 태그와 앱 버전 일치 확인
        run: node scripts/check-tag.mjs "$env:GITHUB_REF_NAME"

      # npm run release가 태그 메시지에 적은 업데이트 내역을 Release 본문으로 쓴다.
      # checkout은 태그 push일 때 태그를 커밋만 가리키는 일반 태그로 만들어 메시지가 빠지므로, 태그를 다시 받아온다
      - name: 태그에서 업데이트 내역 읽기
        env:
          TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $auth = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes("x-access-token:$env:TOKEN"))
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags --force origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::$tag 태그를 다시 받지 못했어요" }
          node scripts/tag-notes.mjs "$tag" "$env:RUNNER_TEMP/release-notes.md"

      - run: npm test

      - run: npm run typecheck

      # electron-builder는 파일마다 동시에 릴리스를 찾다가 초안을 두 개 만들 수 있으므로,
      # 초안을 먼저 하나만 만들어 두고 electron-builder가 그 초안에 올리게 한다 (재실행이면 있는 초안을 쓴다)
      - name: RCM 저장소에 초안 릴리스 준비
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ids = @(gh api repos/glglekdy/RCM/releases --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($ids.Count -gt 1) {
            Write-Output "::error::RCM 저장소에 $env:TAG 릴리스가 $($ids.Count)개 있어요. 하나만 남기고 지운 뒤 다시 실행하세요"
            exit 1
          }
          if ($ids.Count -eq 0) {
            gh release create "$env:TAG" --repo glglekdy/RCM --draft --title "$env:TAG" --notes ' '
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      # releaseInfo.releaseName은 ${version} 매크로를 풀지 않으므로 태그 이름을 직접 넘긴다
      - name: 빌드하고 RCM 저장소에 초안 릴리스 올리기
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          EP_GH_IGNORE_TIME: 'true'
        run: npm -w @rcm/editor run dist:publish -- "-c.releaseInfo.releaseName=$env:GITHUB_REF_NAME"

      - name: 초안에 업데이트 파일이 모두 있는지 확인
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $ids = @(gh api repos/glglekdy/RCM/releases --paginate --jq '.[] | select(.tag_name == env.TAG) | .id')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($ids.Count -ne 1) {
            Write-Output "::error::RCM 저장소의 $env:TAG 릴리스가 하나가 아니에요 ($($ids.Count)개)"
            exit 1
          }
          $assets = @(gh api "repos/glglekdy/RCM/releases/$($ids[0])" --jq '.assets[].name')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $version = $env:TAG.Substring(1)
          foreach ($name in @('latest.yml', "RCM-Setup-$version.exe", "RCM-Setup-$version.exe.blockmap")) {
            if ($assets -notcontains $name) {
              Write-Output "::error::초안 릴리스에 $name 파일이 없어요"
              exit 1
            }
          }
          "RELEASE_ID=$($ids[0])" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: 업데이트 내역을 넣고 정식 릴리스로 공개
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          gh api -X PATCH "repos/glglekdy/RCM/releases/$env:RELEASE_ID" -F draft=false -F "body=@$env:RUNNER_TEMP/release-notes.md" --silent
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # 공개 저장소(RCM)에는 최신 버전만 둔다: 모든 버전의 설치 파일과 업데이트 내역은 이 저장소(비공개)의 같은 태그 Release로 보관한다
      - name: RCM-Dev에 이번 버전 보관
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.Substring(1)
          $dist = 'apps/editor/dist'
          $files = @("$dist/latest.yml", "$dist/RCM-Setup-$version.exe", "$dist/RCM-Setup-$version.exe.blockmap")
          foreach ($f in $files) {
            if (-not (Test-Path $f)) { Write-Output "::error::보관할 $f 파일이 없어요"; exit 1 }
          }
          gh release view "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --json id --jq .id 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # 다시 실행한 경우: 파일만 바꿔 올린다
            gh release upload "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --clobber @files
          } else {
            gh release create "$env:TAG" --repo "$env:GITHUB_REPOSITORY" --verify-tag --latest=false --title "$env:TAG" --notes-file "$env:RUNNER_TEMP/release-notes.md" @files
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # RCM-Dev에 설치 파일이 보관된 버전만 지운다 (유일한 사본을 지우지 않게)
      - name: RCM에서 이전 버전 지우기
        env:
          DEV_TOKEN: ${{ github.token }}
          PUBLIC_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $env:GH_TOKEN = $env:PUBLIC_TOKEN
          $old = @(gh api repos/glglekdy/RCM/releases --paginate --jq '.[] | select(.draft == false and .tag_name != env.TAG) | .tag_name')
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $failed = $false
          foreach ($tag in $old) {
            $env:GH_TOKEN = $env:DEV_TOKEN
            $archived = @(gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>$null)
            if ($LASTEXITCODE -ne 0 -or $archived -notcontains "RCM-Setup-$($tag.Substring(1)).exe") {
              Write-Output "::warning::$tag 설치 파일이 RCM-Dev에 보관되지 않아 RCM에서 지우지 않았어요"
              continue
            }
            $env:GH_TOKEN = $env:PUBLIC_TOKEN
            gh release delete "$tag" --repo glglekdy/RCM --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) { Write-Output "::error::RCM의 $tag 릴리스를 지우지 못했어요"; $failed = $true }
            else { Write-Output "RCM에서 $tag 지움 (RCM-Dev에 보관됨)" }
          }
          if ($failed) { exit 1 }
